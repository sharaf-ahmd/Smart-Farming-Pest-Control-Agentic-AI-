<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriGuard AI - Register</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(
          135deg,
          rgba(17, 24, 39, 0.9),
          rgba(45, 90, 39, 0.95)
        ),
        url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat fixed;
        min-height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        position: relative;
      }

      body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.3);
        z-index: 0;
      }

      .navbar {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(20px);
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }

      .nav-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 1.8rem;
        font-weight: 800;
        background: linear-gradient(135deg, #2d5a27 0%, #4caf50 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        letter-spacing: -0.5px;
        text-decoration: none;
      }

      .logo::before {
        content: "🌾";
        font-size: 2rem;
      }

      .nav-links {
        display: flex;
        list-style: none;
        gap: 2rem;
      }
      .nav-links a {
        text-decoration: none;
        color: #475569;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        transition: all 0.3s ease;
      }
      .nav-links a:hover {
        color: #2d5a27;
        background: rgba(45, 90, 39, 0.08);
        transform: translateY(-1px);
      }

      .container {
        width: 100%;
        max-width: 450px;
        padding: 3rem 2.5rem;
        margin-top: 120px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        text-align: center;
        animation: fadeInUp 0.8s ease;
        position: relative;
        z-index: 1;
      }

      .title {
        font-size: 2.2rem;
        margin-bottom: 0.5rem;
        font-weight: 800;
        letter-spacing: -1px;
        background: linear-gradient(135deg, #1e293b 0%, #2d5a27 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        font-size: 0.95rem;
        color: #64748b;
        margin-bottom: 2.5rem;
        font-weight: 500;
      }

      .form .row {
        margin-bottom: 1.25rem;
        text-align: left;
      }

      .form label {
        display: block;
        margin-bottom: 0.5rem;
        color: #475569;
        font-weight: 600;
        font-size: 0.9rem;
      }

      .form input {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 1rem;
        outline: none;
        background: #f8fafc;
        color: #1e293b;
        transition: all 0.3s ease;
        font-family: inherit;
      }
      .form input:focus {
        border-color: #4caf50;
        background: white;
        box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
      }

      .password-strength {
        margin-top: 0.5rem;
        height: 4px;
        background: #e2e8f0;
        border-radius: 2px;
        overflow: hidden;
      }

      .password-strength-bar {
        height: 100%;
        width: 0%;
        transition: all 0.3s ease;
      }

      .password-strength-bar.weak {
        width: 33%;
        background: #ef4444;
      }

      .password-strength-bar.medium {
        width: 66%;
        background: #f59e0b;
      }

      .password-strength-bar.strong {
        width: 100%;
        background: #4caf50;
      }

      .submit {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        margin-top: 1.5rem;
        transition: all 0.3s ease;
        letter-spacing: 0.5px;
        box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
      }
      .submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 35px rgba(76, 175, 80, 0.5);
      }
      .submit:active {
        transform: translateY(0);
      }

      .result {
        margin-top: 1.5rem;
        padding: 12px;
        border-radius: 12px;
        font-weight: 600;
        display: none;
      }
      .result.success {
        background: rgba(76, 175, 80, 0.1);
        color: #2e7d32;
        display: block;
      }
      .result.error {
        background: rgba(239, 68, 68, 0.1);
        color: #dc2626;
        display: block;
      }

      .login-link {
        margin-top: 2rem;
        font-size: 0.95rem;
        color: #64748b;
        padding-top: 2rem;
        border-top: 1px solid #e2e8f0;
      }
      .login-link a {
        color: #4caf50;
        font-weight: 700;
        text-decoration: none;
        transition: 0.3s;
      }
      .login-link a:hover {
        color: #2e7d32;
        text-decoration: underline;
      }

      .benefits {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid #e2e8f0;
      }

      .benefit {
        text-align: center;
        padding: 1rem;
        background: #f8fafc;
        border-radius: 12px;
      }

      .benefit span {
        font-size: 1.5rem;
        display: block;
        margin-bottom: 0.5rem;
      }

      .benefit p {
        font-size: 0.8rem;
        color: #64748b;
        font-weight: 600;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        .nav-links {
          display: none;
        }
        .container {
          max-width: 90%;
          padding: 2rem 1.5rem;
        }
        .benefits {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="index.html" class="logo">AgriGuard AI</a>
        <ul class="nav-links">
          <li><a href="index.html#home">Home</a></li>
          <li><a href="index.html#agents">Agents</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </div>
    </nav>

    <div class="container">
      <h1 class="title">Join AgriGuard AI 🌱</h1>
      <p class="subtitle">Create your account and start protecting your crops with AI</p>
      
      <form class="form" id="registerForm">
        <div class="row">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username" required minlength="3" />
        </div>
        <div class="row">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Create a strong password"
            required
            minlength="6"
          />
          <div class="password-strength">
            <div class="password-strength-bar" id="strengthBar"></div>
          </div>
        </div>
        <button type="submit" class="submit">Create Account</button>
      </form>
      
      <div id="msg" class="result"></div>

      <div class="login-link">
        Already have an account? <a href="login.html">Login here</a>
      </div>

      <div class="benefits">
        <div class="benefit">
          <span>🔬</span>
          <p>AI-Powered Detection</p>
        </div>
        <div class="benefit">
          <span>📊</span>
          <p>Impact Analysis</p>
        </div>
        <div class="benefit">
          <span>💊</span>
          <p>Smart Treatments</p>
        </div>
        <div class="benefit">
          <span>🤖</span>
          <p>24/7 AI Assistant</p>
        </div>
      </div>
    </div>

    <script>
      // Password strength indicator
      $("#password").on("input", function() {
        const password = $(this).val();
        const strengthBar = $("#strengthBar");
        
        let strength = 0;
        if (password.length >= 6) strength++;
        if (password.length >= 10) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;

        strengthBar.removeClass("weak medium strong");
        if (strength <= 2) {
          strengthBar.addClass("weak");
        } else if (strength <= 4) {
          strengthBar.addClass("medium");
        } else {
          strengthBar.addClass("strong");
        }
      });

      $("#registerForm").submit(function (e) {
        e.preventDefault();

        var username = $("#username").val();
        var password = $("#password").val();
        const msgEl = $("#msg");

        // Show loading state
        $(".submit").text("Creating Account...").prop("disabled", true);
        msgEl.removeClass("success error").hide();

        $.ajax({
          url: "http://127.0.0.1:5000/auth/register",
          type: "POST",
          contentType: "application/json",
          data: JSON.stringify({ username: username, password: password }),
          success: function (data) {
            $(".submit").text("Create Account").prop("disabled", false);
            msgEl.text("✓ " + (data.msg || "Account created successfully! Redirecting to login...")).addClass("success");

            setTimeout(() => (window.location.href = "login.html"), 1500);
          },
          error: function (err) {
            console.error(err);
            $(".submit").text("Create Account").prop("disabled", false);
            msgEl.text("✗ " + (err.responseJSON?.msg || "Registration failed! Please try again.")).addClass("error");
          },
        });
      });
    </script>
  </body>
</html>
